[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Open-source intraday research and trading engine for NSE via Angel One SmartAPI"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pandas>=2.1",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6",
  "python-dotenv>=1",
  "requests>=2.31",
  "tzdata>=2024.1",
  "smartapi-python>=1.5",
  "pyotp>=2.9",
  "logzero>=1.7",
  "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tradebot = "tradebot.main:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
